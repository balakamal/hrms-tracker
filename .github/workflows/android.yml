name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
      with:
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'
        cache-disabled: true

    - name: Generate Launcher Icons
      run: |
        python3 -m pip install pillow
        python3 scripts/generate_icons.py

    - name: Ensure Persistent Keystore
      run: |
        mkdir -p android/keystore
        if [ ! -f android/keystore/debug.keystore ]; then
          echo "Generating persistent debug keystore for consistent APK signatures..."
          keytool -genkeypair -v -keystore android/keystore/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
        fi

    - name: Build with Gradle
      run: |
        set -eo pipefail
        cd android
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

    - name: Print Build Log on Failure
      if: failure()
      run: tail -n 100 android/build_log.txt || true

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: android/build_log.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hrms-insights-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Commit and Push APK to Repo
      run: |
        mkdir -p builds
        VERSION=$(grep 'versionName' android/app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
        cp android/app/build/outputs/apk/debug/app-debug.apk builds/app-debug.apk
        cp android/app/build/outputs/apk/debug/app-debug.apk "builds/hrms-tracker-v${VERSION}.apk"
        cp android/app/build/outputs/apk/debug/app-debug.apk "builds/hrms-insights-v${VERSION}.apk"
        cp android/app/build/outputs/apk/debug/app-debug.apk builds/hrms-tracker-latest.apk
        $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest print builds/app-debug.apk > builds/AndroidManifest.xml || true
        
        # Extract exact compiled versionCode and calculate APK size
        VERSION_CODE=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code builds/app-debug.apk 2>/dev/null || echo "$((100 + GITHUB_RUN_NUMBER))")
        APK_SIZE=$(ls -lh builds/hrms-tracker-latest.apk | awk '{print $5}')
        TODAY=$(date +'%Y-%m-%d')
        COMMIT_TITLE=$(git log -1 --pretty=%s | tr -d '"\n')
        
        cat <<EOF > version.json
{
  "versionCode": ${VERSION_CODE},
  "versionName": "${VERSION}",
  "releaseDate": "${TODAY}",
  "releaseNotes": "${COMMIT_TITLE}",
  "apkUrl": "https://raw.githubusercontent.com/balakamal/hrms-tracker/main/builds/hrms-tracker-latest.apk",
  "apkSize": "${APK_SIZE}"
}
EOF

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add builds/ android/app/src/main/res/ android/keystore/ version.json
        git commit -m "build: compile, extract manifest and update builds/ [skip ci]" || true
        git pull --rebase origin main || true
        git push origin HEAD:main
